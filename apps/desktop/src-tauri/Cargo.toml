[package]
name = "jam-desktop"
description = "JAM Code, a local-first desktop workspace for coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
cc = "1.5.1"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
jam-runtime = { path = "../../../crates/runtime" }
base64 = "0.22.1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2.12.0", features = ["tray-icon", "image-png", "image-ico", "unstable"] }
tauri-plugin-single-instance = "2.4.5"
# System notifications (Windows toasts, macOS User Notifications).
tauri-plugin-notification = "2"
# The native folder picker (Windows IFileOpenDialog, macOS NSOpenPanel).
rfd = { version = "0.16", default-features = false }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
