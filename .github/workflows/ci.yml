name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI builds from a cache, never incrementally, and nothing debugs these
  # binaries: without debug info they link faster and the cache is smaller.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  # Pull requests that touch no Rust skip the Rust jobs; main always runs them.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo rust=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request checks out its merge commit; its first parent is the base.
          if git diff --name-only HEAD^1 HEAD |
            grep -qE '^(crates/|apps/desktop/src-tauri/|Cargo\.(toml|lock)$|rust-toolchain|\.github/workflows/)'
          then
            echo rust=true >> "$GITHUB_OUTPUT"
          else
            echo rust=false >> "$GITHUB_OUTPUT"
          fi

  # Format, lint, types, tests and the production frontend build do not depend
  # on the OS, so they run once, beside the Rust jobs.
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Reads cargo metadata for the Windows and macOS targets; no build.
      - name: Third-party notices are current
        run: node scripts/third-party-notices.mjs --check

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Windows builds much faster on a Dev Drive (ReFS, no real-time scanning).
      - uses: samypr100/setup-dev-drive@v4
        if: runner.os == 'Windows'
        with:
          drive-size: 12GB
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `pnpm check:rust` locally; Clippy covers `cargo check`, so it runs once.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
